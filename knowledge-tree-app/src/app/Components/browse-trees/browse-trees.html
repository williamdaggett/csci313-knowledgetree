<div class="container text-center">
  <h1 class="m-5">Browse Community Trees</h1>
  <div class="input-group input-group-lg">
    <span class="input-group-text" id="inputGroup-sizing-lg">Search</span>
    <input
      [(ngModel)]="filter"
      type="text"
      class="form-control"
      aria-label="Sizing example input"
      aria-describedby="inputGroup-sizing-lg"
      placeholder="Search By Name or Description"
    />
  </div>
  <!--Fix when tree list item is implemented and when tree api is implemented-->
  <table class="table table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Creation Date</th>
        <th>Author</th>
        <th></th>
      </tr>
    </thead>

    <tbody>
      @for (t of paginatedTrees(); track $index; let i = $index) {
        <tr [class.table-light]="i % 2 === 0" [class.table-secondary]="i % 2 !== 0">
          <td>{{ t.name }}</td>
          <td>{{ t.description }}</td>
          <td>{{ t.date_created.toDate().toDateString() }}</td>
          <td>{{ authorNames()[$index] }}</td>
          <td>
            <button class="btn btn-primary" [class.disabled]="loading()" (click)="learn(t)">
              Learn
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <nav class="mt-3">
    <ul class="pagination">
      <li class="page-item" [class.disabled]="visibleBase() <= 1">
        <button class="page-link" (click)="adjustPages(-5)">Previous</button>
      </li>
      @for (page of visiblePages(); track $index) {
        <li class="page-item" [class.active]="currentPage() === page">
          <button class="page-link" (click)="goToPage(page)">
            {{ page }}
          </button>
        </li>
      }

      <li
        class="page-item"
        [class.disabled]="visibleBase() + visiblePages().length - 1 >= totalPages()"
      >
        <button class="page-link" (click)="adjustPages(5)">Next</button>
      </li>
    </ul>
  </nav>
</div>
