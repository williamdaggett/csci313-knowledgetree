<div class="signup-container">
  <h2>Create Account</h2>

  <form (ngSubmit)="onRegister()">
    <div>
      <label>Display Name</label>
      <input
        type="text"
        [ngModel]="displayName()"
        (ngModelChange)="displayName.set($event)"
        name="displayName"
        required
      />
    </div>

    <div>
      <label>Email</label>
      <input
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        required
      />
    </div>

    <div>
      <label>Password</label>
      <input
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        required
      />
    </div>

    <button class="btn btn-primary m-2" type="submit" [disabled]="loading()">
      @if (loading()) {
        Creating account...
      } @else {
        Create Account
      }
    </button>
    <div>
      <a routerLink="/login">Back</a>
    </div>
  </form>

  @if (error()) {
    <p style="color: red">{{ error() }}</p>
  }
</div>
