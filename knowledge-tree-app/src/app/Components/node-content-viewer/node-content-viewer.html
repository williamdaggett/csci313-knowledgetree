<div class="content-viewer">
  @if (isVideo(item())) {
    <h3>{{ item().title }}</h3>
    <p>{{ item().description }}</p>

    <iframe [src]="getVideoEmbedUrl(item().url)"> </iframe>
  }

  @if (item().type === 'image') {
    <h3>{{ item().title }}</h3>
    <p>{{ item().description }}</p>
    <img [src]="item().url" [alt]="item().title" />
  }

  @if (item().type === 'text') {
    <div>
      <h3>{{ item().title }}</h3>
      {{ item().content }}
    </div>
  }
</div>
