<div class="container text-center">
  @if (TreeMetaDataId()) {
    <h1>Edit Your Tree</h1>
  } @else {
    <h1>Create Your Tree</h1>
  }
  <div class="row">
    <div class="col-md-4"></div>
    <div class="col-md-4">
      <form (ngSubmit)="SaveTree()">
        <div>
          <label class="form-label">Tree Name</label>
          <input class="form-control" type="text" [(ngModel)]="TreeName" name="TreeName" required />
        </div>

        <div>
          <label class="form-label">Tree Description</label>
          <input
            class="form-control"
            type="text"
            [(ngModel)]="TreeDescription"
            name="TreeDescription"
            required
          />
        </div>

        @if (save() && TreeMetaDataId()) {
          <button class="btn btn-primary m-2" type="submit" [disabled]="loading()">
            Save Tree
          </button>
          <h3>Tree Saved Succsesfully</h3>
        } @else if (!TreeMetaDataId()) {
          <button class="btn btn-primary m-2" type="submit" [disabled]="loading()">
            Create Tree
          </button>
        } @else {
          <button class="btn btn-primary m-2" type="submit" [disabled]="loading()">
            Save Tree Info
          </button>
          <h3>Tree not saved!</h3>
        }
      </form>
    </div>
  </div>
  @if (TreeMetaDataId()) {
    <div class="card mt-5">
      <div class="card-header"><h3>Tree Editor</h3></div>
      <div class="card-body">
        <p></p>
        <p>Create Tree Editor here</p>
        <p></p>
      </div>
    </div>
  }
</div>
