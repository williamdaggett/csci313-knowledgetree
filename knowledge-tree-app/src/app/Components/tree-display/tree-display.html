<div class="container-fluid mt-5">
  <div class="row align-items-stretch" style="min-height: 85vh">
    <div class="col-md-4 d-flex">
      <div class="card flex-fill">
        <div class="card-header display-card-head">
          @if (nodeName() === '') {
            <h2>Node Content</h2>
          } @else {
            <h2>{{ nodeName() }}</h2>
          }
        </div>

        <div class="card-body d-flex flex-column">
          @switch (contentId()) {
            @case ('LOCK') {
              <h5 class="text-center">Complete the prior nodes before completing this one</h5>
            }
            @default {
              <app-node-content-list [content]="content()"></app-node-content-list>
            }
          }

          <button
            class="btn btn-success mt-auto"
            [class.disabled]="!contentCompletable()"
            (click)="completeNode()"
          >
            Complete Node
          </button>
        </div>
      </div>
    </div>

    <div class="col-md-8 d-flex">
      <div class="card flex-fill">
        <div class="card-header display-card-head">
          <h2>{{ TreeName() }} --- {{ TreeDescription() }} --- {{ progress() }}</h2>

          <button class="btn btn-primary" (click)="saveTree()" [class.disabled]="saved()">
            Save Progress
          </button>
        </div>

        <div class="card-body">
          <app-diagram-display (loadContent)="receiveId($event)"></app-diagram-display>
        </div>
      </div>
    </div>
  </div>
</div>
