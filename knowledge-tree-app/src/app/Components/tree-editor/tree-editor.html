<div class="container text-center">
  <h1>Edit Your Tree</h1>
  <div class="row">
    <div class="col-md-4"></div>
    <div class="col-md-4">
      <form (ngSubmit)="SaveTree()">
        <div>
          <label class="form-label">Tree Name</label>
          <input class="form-control" type="text" [(ngModel)]="TreeName" name="TreeName" required />
        </div>

        <div>
          <label class="form-label">Tree Description</label>
          <input
            class="form-control"
            type="text"
            [(ngModel)]="TreeDescription"
            name="TreeDescription"
            required
          />
        </div>
        <button
          class="btn btn-primary m-2"
          type="submit"
          [disabled]="loading() || saveDescription()"
        >
          Save Title/Description
        </button>
      </form>
      <button
        class="btn btn-success"
        (click)="publish()"
        [disabled]="!saveDescription() || treeAPI.nodeChange() || contentService.contentChange()"
      >
        Publish Tree
      </button>
      @if (saveDescription() && !treeAPI.nodeChange()) {
        <p>
          Note: Publishing tree will make you unable to edit it in the future and make the tree
          public
        </p>
      }
    </div>
  </div>
  <div class="card mt-5">
    <div class="card-header"><h3>Tree Editor</h3></div>
    <div class="card-body">
      <p>To edit the tree click on it's nodes</p>
      <button
        class="btn btn-primary"
        (click)="saveDiagram()"
        [disabled]="!treeAPI.nodeChange() && !contentService.contentChange()"
      >
        Save Diagram
      </button>
      <app-diagram-edit></app-diagram-edit>
    </div>
  </div>
</div>
