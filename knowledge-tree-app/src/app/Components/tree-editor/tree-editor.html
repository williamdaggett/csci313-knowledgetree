<div class="container text-center">
  <h1>Edit Your Tree</h1>
  <div class="row">
    <div class="col-md-4"></div>
    <div class="col-md-4">
      <form (ngSubmit)="SaveTree()">
        <div>
          <label class="form-label">Tree Name</label>
          <input class="form-control" type="text" [(ngModel)]="TreeName" name="TreeName" required />
        </div>

        <div>
          <label class="form-label">Tree Description</label>
          <input
            class="form-control"
            type="text"
            [(ngModel)]="TreeDescription"
            name="TreeDescription"
            required
          />
        </div>
        <button class="btn btn-primary m-2" type="submit" [disabled]="loading()">Save Tree</button>
        @if (!save()) {
          <h3>Tree not saved!</h3>
        }
      </form>
    </div>
  </div>
  <div class="card mt-5">
    <div class="card-header"><h3>Tree Editor</h3></div>
    <div class="card-body">
      <p>To edit the tree click on it's nodes</p>
      <button class="btn btn-primary" (click)="saveDiagram()">Save Diagram</button>
      <app-diagram-edit></app-diagram-edit>
    </div>
  </div>
</div>
